{% extends "base.html" %}
{% block title %}Persiapan CBT OMI - RoboMANTAP{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center p-4 py-8">
  <div class="max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-7 shadow-2xl space-y-6">
    <div class="border-b border-slate-800 pb-4">
      <a href="/omi/{{ 'mts' if 'MTs' in jenjang else 'ma' }}" class="text-xs text-slate-400 hover:text-emerald-400">← Ganti Bidang OMI</a>
      <span class="block text-[10px] font-bold text-emerald-400 uppercase tracking-widest mt-3">Persiapan CBT OMI</span>
      <h1 class="text-xl sm:text-2xl font-black text-white mt-1">{{ mapel }}</h1>
      <p class="text-xs text-slate-400 mt-1">{{ jenjang }} • Latihan 10 soal</p>
    </div>

    <div id="omi-start-shell">
      {% include "setup_form.html" %}
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function toggleAllSubmateri(){
  const xs=[...document.querySelectorAll('.submateri-check')];
  const all=xs.length && xs.every(x=>x.checked);
  xs.forEach(x=>x.checked=!all);
}

// Prevent accidental double-submit even if the browser is slow to paint.
document.addEventListener('htmx:beforeRequest', function(evt){
  const form = evt.detail.elt;
  if (!form || form.id !== 'omi-start-form') return;
  const button = document.getElementById('omi-start-button');
  if (button) {
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
  }
  const status = document.getElementById('omi-start-status');
  if (status) {
    status.textContent = '🤖 RoboMANTAP sedang membuat 10 soal OMI dengan AI. Mohon tunggu, jangan klik lagi.';
    status.className = 'text-center text-[10px] text-emerald-400 font-medium animate-pulse';
  }
});

document.addEventListener('htmx:afterRequest', function(evt){
  const form = evt.detail.elt;
  if (!form || form.id !== 'omi-start-form') return;
  // On success HX-Redirect takes over. Re-enable only on an actual failure.
  if (!evt.detail.successful) {
    const button = document.getElementById('omi-start-button');
    if (button) {
      button.disabled = false;
      button.removeAttribute('aria-busy');
    }
  }
});
</script>
{% endblock %}
