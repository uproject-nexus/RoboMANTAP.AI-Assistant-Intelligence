{% extends "base.html" %}
{% block title %}Persiapan CBT OMI - RoboMANTAP{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center p-4 py-8">
  <div class="max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-7 shadow-2xl space-y-6">
    <div class="border-b border-slate-800 pb-4">
      <a href="/omi/{{ 'mts' if 'MTs' in jenjang else 'ma' }}" class="text-xs text-slate-400 hover:text-emerald-400">← Ganti Bidang OMI</a>
      <span class="block text-[10px] font-bold text-emerald-400 uppercase tracking-widest mt-3">Persiapan CBT OMI</span>
      <h1 class="text-xl sm:text-2xl font-black text-white mt-1">{{ mapel }}</h1>
      <p class="text-xs text-slate-400 mt-1">{{ jenjang }} • Latihan 10 soal</p>
    </div>
    {% include "setup_form.html" %}
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function toggleAllSubmateri(){
  const xs=[...document.querySelectorAll('.submateri-check')];
  const all=xs.length && xs.every(x=>x.checked);
  xs.forEach(x=>x.checked=!all);
}

function setOmiStartLoading(form, loading){
  const button=document.getElementById('omi-start-button');
  const normal=document.getElementById('omi-start-normal');
  const indicator=document.getElementById('omi-start-indicator');
  const status=document.getElementById('omi-start-status');
  if(!button) return;

  button.disabled=loading;
  if(normal) normal.classList.toggle('hidden', loading);
  if(indicator){
    indicator.classList.toggle('hidden', !loading);
    indicator.classList.toggle('flex', loading);
  }
  if(status){
    status.textContent=loading
      ? '🤖 RoboMANTAP sedang membuat 10 soal OMI dengan AI. Mohon tunggu, jangan klik lagi.'
      : 'RoboMANTAP akan menyiapkan 10 soal AI. Jangan menekan tombol berulang kali.';
    status.className=loading
      ? 'text-center text-[10px] text-emerald-400 font-medium animate-pulse'
      : 'text-center text-[10px] text-slate-500';
  }
}

document.body.addEventListener('htmx:beforeRequest', function(evt){
  if(evt.detail && evt.detail.elt && evt.detail.elt.id==='omi-start-form'){
    setOmiStartLoading(evt.detail.elt, true);
  }
});

document.body.addEventListener('htmx:afterRequest', function(evt){
  if(evt.detail && evt.detail.elt && evt.detail.elt.id==='omi-start-form' && !evt.detail.successful){
    setOmiStartLoading(evt.detail.elt, false);
  }
});
</script>
{% endblock %}
