<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboMANTAP TKA</title><style>:root{--bg:#020617;--card:#0f172a;--line:#334155;--muted:#94a3b8;--green:#10b981;--green2:#059669;--text:#e2e8f0}*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:var(--bg);color:var(--text)}.wrap{max-width:900px;margin:auto;padding:18px}.hero{padding:12px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #475569;background:#0b1220;color:var(--text)}button{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:0;font-weight:800;cursor:pointer}.q{padding:16px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.stim{background:#020617;border:1px solid #334155;border-radius:10px;padding:12px;margin:10px 0;color:#cbd5e1}.muted{color:var(--muted)}.ok{color:#86efac}.err{color:#f87171}.top{position:sticky;top:0;z-index:5;background:rgba(2,6,23,.96);backdrop-filter:blur(8px);padding:8px 0;border-bottom:1px solid var(--line)}label{display:block;margin:8px 0}.choice{display:block;padding:9px;border-radius:8px;border:1px solid transparent}.choice:hover{border-color:#475569;background:#111827}</style></head><body><div class="wrap"><div class="hero"><h1>🎓 RoboMANTAP TKA</h1><p class="muted">Portal ujian siswa · autosave jawaban · waktu mengikuti server.</p></div><div id="login" class="card"><h2>Masuk TKA</h2><input id="session" placeholder="Token sesi"><input id="student" placeholder="Student ID"><input id="code" type="password" placeholder="Kode akses siswa"><button onclick="login()">Masuk & Mulai</button><div id="msg" class="muted"></div></div><div id="exam" hidden></div></div><script>
let access='',attempt='',examData=null;
const $=id=>document.getElementById(id);
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.detail||d.reason||'Request gagal');return d}
async function login(){try{let session=$('session').value.trim(),student=$('student').value.trim(),code=$('code').value;let d=await api('/api/tka/student/login',{method:'POST',body:JSON.stringify({session_token:session,student_id:student,access_code:code})});access=d.access_token;let a=await api('/api/tka/student/attempts',{method:'POST',body:JSON.stringify({session_token:session,student_id:student,access_code:code})});attempt=a.attempt_id;await renderExam()}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
function stimulusHtml(q){if(!q.stimulus_id)return '';let s=examData.stimuli[q.stimulus_id];if(!s)return '';let c=esc(s.content);if(s.stimulus_type==='IMAGE'&&/^https?:\/\//i.test(s.content))c='<img src="'+esc(s.content)+'" alt="Stimulus" style="max-width:100%;border-radius:8px">';return '<div class="stim"><b>'+esc(s.stimulus_type)+'</b><div style="margin-top:7px">'+c+'</div></div>'}
async function renderExam(){examData=await api('/api/tka/student/attempts/'+attempt+'/exam',{headers:{'X-TKA-Access-Token':access}});let d=examData;let h='<div class="top"><b>'+esc(d.exam.title)+'</b><span class="muted"> · '+esc(d.exam.subject_id)+' · '+esc(d.exam.jenjang)+' · Paket '+d.attempt.package_index+'</span><div id="timer" class="muted"></div></div>';for(const q of d.questions){h+='<div class="q">'+stimulusHtml(q)+'<b>'+q.number+'. '+esc(q.prompt)+'</b>';if(q.question_type==='PG'||q.question_type==='MCMA'){for(let i=0;i<q.options.length;i++){let name='q_'+q.question_id+(q.question_type==='MCMA'?'[]':'');let type=q.question_type==='MCMA'?'checkbox':'radio';h+='<label class="choice"><input type="'+type+'" name="'+name+'" value="'+esc(q.options[i])+'"> '+String.fromCharCode(65+i)+'. '+esc(q.options[i])+'</label>'}}else{h+='<input id="q_'+q.question_id+'" placeholder="Jawaban">'}h+='<button onclick="save(\''+q.question_id+'\',\''+q.question_type+'\')">💾 Simpan jawaban</button></div>'}h+='<div class="card"><button onclick="submitExam()">Kirim Jawaban & Lihat Hasil</button><div id="result"></div></div>';let el=$('exam');el.innerHTML=h;$('login').hidden=true;el.hidden=false;let end=new Date(d.attempt.expires_at).getTime();let t=setInterval(()=>{let left=Math.max(0,end-Date.now());$('timer').textContent='Sisa waktu: '+Math.floor(left/60000)+' menit '+Math.floor(left/1000)%60+' detik';if(left<=0)clearInterval(t)},1000)}
async function save(id,type){let v;if(type==='MCMA')v=[...document.querySelectorAll('[name="q_'+id+'[]"]:checked')].map(x=>x.value);else if(type==='PG')v=(document.querySelector('[name="q_'+id+'"]:checked')||{}).value||'';else v=$('q_'+id).value;try{await api('/api/tka/student/attempts/'+attempt+'/answers/'+id,{method:'PUT',headers:{'X-TKA-Access-Token':access},body:JSON.stringify({answer:v})});alert('Jawaban tersimpan')}catch(e){alert(e.message)}}
async function submitExam(){if(!confirm('Kirim jawaban sekarang?'))return;try{let d=await api('/api/tka/student/attempts/'+attempt+'/submit',{method:'POST',headers:{'X-TKA-Access-Token':access}});$('result').innerHTML='<h2>Hasil</h2><p>Skor: <b>'+d.scaled_score+'/100</b></p><p>'+esc(d.achievement_category)+'</p>'}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
