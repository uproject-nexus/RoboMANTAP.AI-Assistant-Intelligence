<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoboMANTAP • TKA Siswa</title>
<style>
:root{--bg:#020617;--panel:#0b1220;--line:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--green:#10b981;--green2:#059669;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#020617,#07111f);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:auto;padding:20px}.top{margin-bottom:16px}.badge,.pill{display:inline-flex;border:1px solid #334155;background:#0f172a;color:#a7f3d0;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
h1,h2,h3{margin:0 0 7px}.hint{color:var(--muted)}.card{background:rgba(11,18,32,.96);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;color:#cbd5e1;font-weight:800;font-size:13px;margin:7px 0 5px}
input{width:100%;border:1px solid #334155;background:#07101e;color:var(--text);border-radius:10px;padding:12px}
button{border:0;border-radius:10px;padding:12px 15px;background:linear-gradient(135deg,var(--green),var(--green2));color:white;font-weight:900;cursor:pointer}
button.secondary{background:#172033;border:1px solid #334155}.hidden{display:none!important}.error{color:#fecaca;background:#2b0b0b;border:1px solid #7f1d1d;border-radius:10px;padding:10px}.ok{color:#a7f3d0;background:#052e25;border:1px solid #065f46;border-radius:10px;padding:10px}
.examhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.timer{font:900 24px ui-monospace,monospace;color:#a7f3d0;text-align:right}.q{border:1px solid #263449;border-radius:14px;padding:16px;margin:12px 0;background:#091321}.qhead{display:flex;justify-content:space-between;gap:10px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #253247;background:#07101e;border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}.choice input{width:auto;margin-top:4px}.stimulus{border-left:3px solid #10b981;background:#07101e;border-radius:9px;padding:12px;margin:10px 0;white-space:pre-wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.progress{height:8px;background:#172033;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#10b981;width:0}.secure{font-size:12px;color:#64748b}
@media(max-width:700px){.grid{grid-template-columns:1fr}.examhead{display:block}.timer{text-align:left;margin-top:8px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><span class="badge">SISWA • TKA ROBO MANTAP</span><h1>Portal TKA</h1><p class="hint">Gunakan data akses yang diberikan Guru. Token adalah credential sesi; ID Peserta adalah identitas peserta; Kode Akses bersifat pribadi.</p></header>

<section id="loginCard" class="card">
<h2>Masuk TKA</h2>
<div class="grid">
<div><label>Token Sesi</label><input id="session" autocomplete="off" placeholder="Token dari Guru"></div>
<div><label>ID Peserta</label><input id="student" autocomplete="off" placeholder="ID Peserta Anda"></div>
<div><label>Kode Akses</label><input id="code" type="password" autocomplete="off" placeholder="Kode akses pribadi"></div>
</div>
<div class="actions"><button onclick="login()">Masuk & Mulai</button></div>
<p class="secure">Data akses dikirim ke TKA API melalui koneksi HTTPS. Jangan bagikan Kode Akses kepada siswa lain.</p>
<div id="loginMsg"></div>
</section>

<section id="exam" class="hidden"></section>
<script>
const $=id=>document.getElementById(id);let access='',attempt='',examData=null,timer=null,startedAt=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function msg(id,text,kind='error'){$(id).innerHTML='<div class="'+kind+'">'+esc(text)+'</div>'}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||d.reason||('Permintaan gagal ('+r.status+')'));return d}
function explain(e){if(String(e).includes('403'))return'Akses ditolak. Periksa Token Sesi, ID Peserta, dan Kode Akses.';if(String(e).includes('404'))return'Sesi/ujian tidak ditemukan atau belum aktif.';return e}
async function login(){try{msg('loginMsg','Memeriksa akses...','ok');const session=$('session').value.trim(),student=$('student').value.trim(),code=$('code').value.trim();if(!session||!student||!code)throw Error('Tiga data akses wajib diisi.');const d=await api('/api/tka/student/login',{method:'POST',body:JSON.stringify({session_token:session,student_id:student,access_code:code})});access=d.access_token;const a=await api('/api/tka/student/attempts',{method:'POST',body:JSON.stringify({session_token:session,student_id:student,access_code:code})});attempt=a.attempt_id;$('loginCard').classList.add('hidden');await renderExam()}catch(e){msg('loginMsg',explain(e.message),'error')}}
async function renderExam(){examData=await api('/api/tka/student/attempts/'+attempt+'/exam',{headers:{'X-TKA-Access-Token':access}});const d=examData;let h='<div class="card examhead"><div><span class="pill">PAKET '+esc(d.attempt.package_index)+'</span><h2>'+esc(d.exam.title)+'</h2><p class="hint">'+esc(d.exam.subject_id)+' • '+esc(d.exam.jenjang)+'</p></div><div><div class="pill">SEDANG MENGERJAKAN</div><div id="timer" class="timer">--:--</div></div></div><div class="progress"><div id="bar"></div></div>';for(const q of d.questions){h+='<article class="q"><div class="qhead"><h3>'+q.number+'. '+esc(q.prompt)+'</h3><span class="pill">'+esc(q.question_type)+'</span></div>';if(q.stimulus_id&&d.stimuli&&d.stimuli[q.stimulus_id])h+='<div class="stimulus"><b>Stimulus</b><br>'+esc(d.stimuli[q.stimulus_id].content)+'</div>';if(q.question_type==='PG'||q.question_type==='MCMA'){for(let i=0;i<q.options.length;i++){const name=q.question_type==='MCMA'?'q_'+q.question_id+'[]':'q_'+q.question_id;const type=q.question_type==='MCMA'?'checkbox':'radio';h+='<label class="choice"><input type="'+type+'" name="'+name+'" value="'+esc(q.options[i])+'"><span><b>'+String.fromCharCode(65+i)+'.</b> '+esc(q.options[i])+'</span></label>'}}else{h+='<label>Respons</label><input id="q_'+q.question_id+'" placeholder="Masukkan respons sesuai instruksi soal">'}h+='<div class="actions"><button class="secondary" onclick="save(\''+q.question_id+'\',\''+q.question_type+'\')">Simpan Jawaban</button></div></article>'}h+='<div class="card"><div class="notice"><b>Sebelum mengirim:</b> pastikan seluruh jawaban telah disimpan. Setelah submit, attempt tidak dapat dilanjutkan.</div><div class="actions"><button onclick="submitExam()">Kirim Jawaban & Selesaikan TKA</button></div><div id="result"></div></div>';$('exam').innerHTML=h;$('exam').classList.remove('hidden');startedAt=Date.now();startTimer(d);renderProgress()}
function startTimer(d){clearInterval(timer);const sec=Number(d.exam.duration_seconds||0);if(!sec){$('timer').textContent='Server timer';return}let end=startedAt+sec*1000;function tick(){let left=Math.max(0,end-Date.now()),s=Math.floor(left/1000),m=Math.floor(s/60),r=s%60;$('timer').textContent=m+':'+String(r).padStart(2,'0');if(left<=0){clearInterval(timer);submitExam(true)}}tick();timer=setInterval(tick,1000)}
function renderProgress(){const total=examData.questions.length;function update(){let answered=0;for(const q of examData.questions){if(q.question_type==='PG'||q.question_type==='MCMA'){if(document.querySelector('[name="q_'+q.question_id+'"]:checked'))answered++}else if($('q_'+q.question_id)?.value.trim())answered++}$('bar').style.width=(total?answered/total*100:0)+'%'}document.addEventListener('change',update,{once:false});update()}
async function save(qid,type){try{let answer;if(type==='PG'){const el=document.querySelector('[name="q_'+qid+'"]:checked');answer=el?el.value:null}else if(type==='MCMA'){answer=[...document.querySelectorAll('[name="q_'+qid+'[]"]:checked')].map(x=>x.value)}else{answer=$('q_'+qid)?.value.trim()||null}if(answer===null||(Array.isArray(answer)&&!answer.length))throw Error('Pilih/isi jawaban terlebih dahulu.');await api('/api/tka/student/attempts/'+attempt+'/answers/'+qid,{method:'PUT',headers:{'X-TKA-Access-Token':access},body:JSON.stringify({answer})});toast('Jawaban tersimpan')}catch(e){toast(e.message,true)}}
let toastTimer;function toast(t,bad=false){clearTimeout(toastTimer);let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;padding:11px 15px;border-radius:10px;background:'+(bad?'#7f1d1d':'#065f46')+';color:#fff;font-weight:800;box-shadow:0 10px 30px #0008';document.body.appendChild(el)}el.textContent=t;el.style.display='block';toastTimer=setTimeout(()=>el.style.display='none',1800)}
async function submitExam(auto=false){if(!auto&&!confirm('Yakin semua jawaban sudah disimpan? Setelah dikirim, ujian selesai.'))return;try{const d=await api('/api/tka/student/attempts/'+attempt+'/submit',{method:'POST',headers:{'X-TKA-Access-Token':access},body:JSON.stringify({})});clearInterval(timer);$('result').innerHTML='<div class="ok"><b>TKA selesai.</b><br>Hasil telah dicatat oleh server. Silakan kembali ke portal RoboMANTAP untuk melihat layanan lanjutan yang tersedia.</div>';document.querySelectorAll('button,input').forEach(x=>x.disabled=true)}catch(e){toast(e.message,true)}}
</script>
</body>
</html>
