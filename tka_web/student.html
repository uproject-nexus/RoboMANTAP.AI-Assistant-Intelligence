<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboMANTAP TKA</title><style>body{font-family:system-ui;margin:0;background:#020617;color:#e2e8f0}.wrap{max-width:900px;margin:auto;padding:28px}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:22px;margin:16px 0}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #475569}button{background:#10b981;color:#fff;border:0;font-weight:700;cursor:pointer}.q{padding:16px;border:1px solid #334155;border-radius:12px;margin:12px 0}label{display:block;margin:7px 0}.muted{color:#94a3b8}</style></head><body><div class="wrap"><h1>RoboMANTAP TKA</h1><p class="muted">Masuk dengan token sesi dan kode akses siswa.</p><div id="login" class="card"><input id="session" placeholder="Token sesi"><input id="student" placeholder="Student ID"><input id="code" type="password" placeholder="Kode akses siswa"><button onclick="login()">Masuk & Mulai</button><div id="msg"></div></div><div id="exam" hidden></div></div><script>
let access='',attempt='';
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.detail||d.reason||'Request gagal');return d}
async function login(){try{let session=document.getElementById('session').value.trim(),student=document.getElementById('student').value.trim(),code=document.getElementById('code').value;let d=await api('/api/tka/student/login',{method:'POST',body:JSON.stringify({session_token:session,student_id:student,access_code:code})});access=d.access_token;let a=await api('/api/tka/student/attempts',{method:'POST',body:JSON.stringify({session_token:session,student_id:student,access_code:code})});attempt=a.attempt_id;await renderExam()}catch(e){document.getElementById('msg').textContent=e.message}}
async function renderExam(){let d=await api('/api/tka/student/attempts/'+attempt+'/exam',{headers:{'X-TKA-Access-Token':access}});let h='<div class="card"><h2>'+esc(d.exam.title)+'</h2><p>'+esc(d.exam.subject_id)+' · '+esc(d.exam.jenjang)+' · Paket '+d.attempt.package_index+'</p><p id="timer" class="muted"></p></div>';for(const q of d.questions){h+='<div class="q"><b>'+q.number+'. '+esc(q.prompt)+'</b>';if(q.question_type==='PG'||q.question_type==='MCMA'){for(let i=0;i<q.options.length;i++){let name=q.question_type==='MCMA'?'q_'+q.question_id+'[]':'q_'+q.question_id;let type=q.question_type==='MCMA'?'checkbox':'radio';h+='<label><input type="'+type+'" name="'+name+'" value="'+i+'"> '+String.fromCharCode(65+i)+'. '+esc(q.options[i])+'</label>'}}else{h+='<input id="q_'+q.question_id+'" placeholder="Jawaban">'}h+='<button onclick="save(\''+q.question_id+'\',\''+q.question_type+'\')">Simpan jawaban</button></div>'}h+='<div class="card"><button onclick="submitExam()">Kirim Jawaban & Lihat Hasil</button><div id="result"></div></div>';let el=document.getElementById('exam');el.innerHTML=h;document.getElementById('login').hidden=true;el.hidden=false;let end=new Date(d.attempt.expires_at).getTime();let t=setInterval(()=>{let left=Math.max(0,end-Date.now());document.getElementById('timer').textContent='Sisa waktu: '+Math.floor(left/60000)+' menit '+Math.floor(left/1000)%60+' detik';if(left<=0)clearInterval(t)},1000)}
async function save(id,type){let v;if(type==='MCMA')v=[...document.querySelectorAll('[name="q_'+id+'[]"]:checked')].map(x=>Number(x.value));else if(type==='PG')v=Number((document.querySelector('[name="q_'+id+'"]:checked')||{}).value);else v=document.getElementById('q_'+id).value;try{await api('/api/tka/student/attempts/'+attempt+'/answers/'+id,{method:'PUT',headers:{'X-TKA-Access-Token':access},body:JSON.stringify({answer:v})})}catch(e){alert(e.message)}}
async function submitExam(){if(!confirm('Kirim jawaban sekarang?'))return;try{let d=await api('/api/tka/student/attempts/'+attempt+'/submit',{method:'POST',headers:{'X-TKA-Access-Token':access}});document.getElementById('result').innerHTML='<h2>Hasil</h2><p>Skor: <b>'+d.scaled_score+'/100</b></p><p>'+esc(d.achievement_category)+'</p>'}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
