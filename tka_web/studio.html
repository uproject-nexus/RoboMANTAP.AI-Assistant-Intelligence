<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboMANTAP TKA Studio</title><style>body{font-family:system-ui;max-width:980px;margin:auto;padding:24px;background:#020617;color:#e2e8f0}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:18px;margin:14px 0}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #475569}button{background:#10b981;color:white;border:0;font-weight:700}code{color:#a7f3d0}</style></head><body><h1>RoboMANTAP TKA Studio</h1><div class="card"><input id="secret" type="password" placeholder="TKA Studio Secret"><input id="title" placeholder="Judul TKA"><input id="jenjang" placeholder="MTs atau MA"><input id="subject" placeholder="Subject ID"><input id="duration" type="number" value="3600"><button onclick="create()">Buat Exam</button><p id="out"></p></div><div class="card"><p>Setelah Exam ID tersedia, gunakan operasi API berikut untuk menambah questions/packages, transition DRAFT→REVIEW→VALIDATED, publish, dan membuat session.</p><p>Endpoint terdokumentasi di <code>/docs</code>.</p></div><script>async function create(){try{let r=await fetch('/api/tka/studio/exams',{method:'POST',headers:{'Content-Type':'application/json','X-TKA-Studio-Secret':document.getElementById('secret').value},body:JSON.stringify({title:document.getElementById('title').value,jenjang:document.getElementById('jenjang').value,subject_id:document.getElementById('subject').value,duration_seconds:Number(document.getElementById('duration').value)})});let d=await r.json();document.getElementById('out').textContent=r.ok?'Exam ID: '+d.exam_id:(d.detail||'Gagal')}catch(e){document.getElementById('out').textContent=e.message}}</script></body></html>
