<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workspace CBT - RoboMANTAP</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="bg-emerald-500 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded">CBT v2.0</span>
            <div>
                <h1 class="text-xs sm:text-sm font-bold text-white leading-none">RoboMANTAP CBT</h1>
                <p class="text-[10px] text-emerald-400 mt-0.5 truncate max-w-[130px] sm:max-w-none">{{ sess.config.mapel }}</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-2 sm:space-x-3">
            <button onclick="requestFullscreenMode()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 text-[10px] sm:text-xs font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
                📺 Fullscreen
            </button>
            
            <div class="bg-slate-950 border border-slate-800 px-3 py-1 rounded-lg text-xs">
                ⏱️ <span id="timer-display" class="font-mono text-emerald-400 font-bold">--:--</span>
            </div>
        </div>
    </header>

    <div id="cheat-warning-bar" class="hidden bg-amber-500/20 border-b border-amber-500/40 px-4 py-2 text-center text-xs text-amber-300 font-semibold">
        ⚠️ Warning Pelanggaran Pindah Tab: <span id="violation-count-text">0</span> / 3
    </div>

    <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-5 flex flex-col justify-between">
        
        <div>
            <div class="flex justify-between items-center bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 mb-3 shadow-md">
                <div class="flex items-center space-x-2 text-xs truncate mr-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse flex-shrink-0"></span>
                    <span class="text-slate-200 font-semibold truncate">{{ sess.nama }}</span>
                    <span class="text-slate-600">•</span>
                    <span class="text-emerald-400 font-medium text-[11px] flex-shrink-0">Kelas {{ sess.kelas }}</span>
                </div>

                <button onclick="toggleNavModal(true)" class="bg-emerald-500/10 hover:bg-emerald-500/20 active:scale-95 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1.5 transition flex-shrink-0">
                    <span>📑 Navigasi Soal</span>
                </button>
            </div>

            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col justify-between min-h-[380px]">
                <div>
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                        <span id="label-no-soal" class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Memuat...</span>
                        <span class="text-[10px] sm:text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-lg">Pilihan Ganda</span>
                    </div>

                    <div id="question-text" class="text-slate-100 text-sm sm:text-base leading-relaxed mb-5 font-medium overflow-x-auto"></div>

                    <div id="options-container" class="space-y-2.5"></div>
                </div>
            </section>
        </div>

        <form id="form-submit-exam" action="/submit-exam" method="POST" class="hidden">
            <input type="hidden" name="session_id" value="{{ session_id }}">
        </form>

        <div class="flex items-center justify-between border-t border-slate-800/80 pt-4 mt-4 gap-2">
            <button id="btn-prev" onclick="prevQuestion()" class="flex-1 sm:flex-none bg-slate-800 active:bg-slate-700 text-slate-300 font-bold text-xs py-3 px-4 rounded-xl transition text-center disabled:opacity-40 disabled:cursor-not-allowed">
                ← Prev
            </button>

            <button id="btn-ragu" onclick="toggleRagu()" class="flex-1 sm:flex-none bg-amber-500/10 active:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold py-3 px-4 rounded-xl transition text-center">
                ⚠️ Ragu-Ragu
            </button>

            <button id="btn-next-submit" onclick="handleNextOrSubmit()" class="flex-1 sm:flex-none bg-emerald-500 active:bg-emerald-400 text-slate-950 font-bold text-xs py-3 px-5 rounded-xl transition shadow-[0_0_15px_rgba(16,185,129,0.3)] text-center">
                Next →
            </button>
        </div>

    </main>

    <div id="nav-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                    <span>📑 Navigasi Soal</span>
                </h3>
                <button onclick="toggleNavModal(false)" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>

            <div class="grid grid-cols-3 gap-1.5 text-[10px] text-center">
                <div class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 p-1.5 rounded-lg font-medium">Sudah Dijawab</div>
                <div class="bg-amber-500/20 text-amber-300 border border-amber-500/40 p-1.5 rounded-lg font-medium">Ragu-Ragu</div>
                <div class="bg-slate-950 text-slate-400 border border-slate-800 p-1.5 rounded-lg font-medium">Belum Dijawab</div>
            </div>

            <div id="nav-grid" class="grid grid-cols-5 gap-2 max-h-[60vh] overflow-y-auto p-1"></div>

            <button onclick="toggleNavModal(false)" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2.5 rounded-xl">
                Tutup
            </button>
        </div>
    </div>

    <script>
        // ==============================================================================
        // 1. ANTI-COPAS & WAKE LOCK & ANTI KECURANGAN
        // ==============================================================================
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && ['c', 'v', 'a', 'u', 's', 'p'].includes(e.key.toLowerCase())) e.preventDefault();
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase()))) e.preventDefault();
        });

        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        requestWakeLock();

        let violationCount = 0;
        const maxViolations = 3;
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                if (wakeLock !== null) await requestWakeLock();
            } else if (document.hidden) {
                violationCount++;
                const warningBar = document.getElementById("cheat-warning-bar");
                const countText = document.getElementById("violation-count-text");
                if (warningBar) warningBar.classList.remove("hidden");
                if (countText) countText.textContent = violationCount;

                if (violationCount >= maxViolations) {
                    alert("🚨 DETEKSI KECURANGAN!\n\nAnda meninggalkan tab 3 kali. Ujian otomatis dikirim!");
                    document.getElementById('form-submit-exam').submit();
                } else {
                    alert(`⚠️ PERINGATAN KECURANGAN (${violationCount}/${maxViolations})!\n\nDilarang meninggalkan tab ujian!`);
                }
            }
        });

        function requestFullscreenMode() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen().catch(err => {});
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }

        // ==============================================================================
        // 2. LOGIKA UTAMA CBT ENGINE (FLEXIBLE & NO FLICKER BUG FIX)
        // ==============================================================================
        const quizData = {{ quiz_json | safe }};
        const sessionId = "{{ session_id }}";
        const durationMinutes = {{ sess.config.timer_m if sess.config.timer_m else 30 }};
        
        let currentIndex = 0;
        let answers = {};
        let raguState = {};

        function triggerKaTeX() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        // Toggle Popup Modal Navigasi
        function toggleNavModal(show) {
            const modal = document.getElementById("nav-modal");
            if (show) {
                renderGrid();
                modal.classList.remove("hidden");
            } else {
                modal.classList.add("hidden");
            }
        }

        // Render Halaman Soal saat Berpindah Nomor
        function renderQuestion(index) {
            currentIndex = index;
            const item = quizData[index];
            
            document.getElementById("label-no-soal").textContent = `Soal No. ${index + 1} dari ${quizData.length}`;
            document.getElementById("question-text").innerHTML = item.question;

            const optsDiv = document.getElementById("options-container");
            optsDiv.innerHTML = "";

            item.options.forEach((opt, optIdx) => {
                const isSelected = answers[index] === opt;
                const btn = document.createElement("button");
                btn.id = `opt-btn-${optIdx}`;
                btn.className = `w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm transition flex items-start space-x-3 ${
                    isSelected 
                    ? 'bg-emerald-500/10 border-emerald-500 text-emerald-300 font-medium shadow-[0_0_10px_rgba(16,185,129,0.15)]' 
                    : 'bg-slate-950 border-slate-800 text-slate-300 active:border-slate-700'
                }`;
                btn.onclick = () => selectAnswer(index, opt, optIdx);
                btn.innerHTML = `
                    <span class="w-6 h-6 rounded-full border border-slate-700 flex-shrink-0 flex items-center justify-center text-[11px] font-bold mt-0.5 ${isSelected ? 'border-emerald-500 bg-emerald-500 text-slate-950' : ''}">
                        ${opt.charAt(0)}
                    </span>
                    <span class="leading-relaxed">${opt}</span>
                `;
                optsDiv.appendChild(btn);
            });

            updateNavButtons();
            updateRaguButtonUI();
            setTimeout(triggerKaTeX, 30);
        }

        // Pilihi Jawaban (SMOOTH & ANTI-FLICKER FIX)
        function selectAnswer(index, opt, optIdx) {
            answers[index] = opt;

            // Update UI Opsi Jawaban Secara Langsung TANPA Re-render Soal / Re-trigger KaTeX
            quizData[index].options.forEach((_, idx) => {
                const btn = document.getElementById(`opt-btn-${idx}`);
                if (!btn) return;
                const isSelected = idx === optIdx;
                btn.className = `w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm transition flex items-start space-x-3 ${
                    isSelected 
                    ? 'bg-emerald-500/10 border-emerald-500 text-emerald-300 font-medium shadow-[0_0_10px_rgba(16,185,129,0.15)]' 
                    : 'bg-slate-950 border-slate-800 text-slate-300 active:border-slate-700'
                }`;
                const badge = btn.querySelector('span');
                if (badge) {
                    badge.className = `w-6 h-6 rounded-full border border-slate-700 flex-shrink-0 flex items-center justify-center text-[11px] font-bold mt-0.5 ${
                        isSelected ? 'border-emerald-500 bg-emerald-500 text-slate-950' : ''
                    }`;
                }
            });

            // Kirim jawaban ke backend secara asinkron
            const formData = new FormData();
            formData.append("session_id", sessionId);
            formData.append("q_index", index);
            formData.append("answer", opt);
            fetch("/api/save-answer", { method: "POST", body: formData });
        }

        // Toggle Status Ragu-Ragu
        function toggleRagu() {
            raguState[currentIndex] = !raguState[currentIndex];
            updateRaguButtonUI();
        }

        function updateRaguButtonUI() {
            const btnRagu = document.getElementById("btn-ragu");
            if (raguState[currentIndex]) {
                btnRagu.className = "flex-1 sm:flex-none bg-amber-500 text-slate-950 border border-amber-400 font-bold text-xs py-3 px-4 rounded-xl transition text-center shadow-[0_0_12px_rgba(245,158,11,0.4)]";
            } else {
                btnRagu.className = "flex-1 sm:flex-none bg-amber-500/10 active:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold py-3 px-4 rounded-xl transition text-center";
            }
        }

        // Update Tombol Prev dan Next/Submit
        function updateNavButtons() {
            const btnPrev = document.getElementById("btn-prev");
            const btnNextSubmit = document.getElementById("btn-next-submit");

            // State Prev
            btnPrev.disabled = currentIndex === 0;

            // State Next / Selesai
            if (currentIndex === quizData.length - 1) {
                btnNextSubmit.textContent = "🚀 Selesai Ujian";
                btnNextSubmit.className = "flex-1 sm:flex-none bg-rose-500 hover:bg-rose-400 active:bg-rose-600 text-white font-bold text-xs py-3 px-5 rounded-xl transition shadow-[0_0_15px_rgba(244,63,94,0.4)] text-center";
            } else {
                btnNextSubmit.textContent = "Next →";
                btnNextSubmit.className = "flex-1 sm:flex-none bg-emerald-500 active:bg-emerald-400 text-slate-950 font-bold text-xs py-3 px-5 rounded-xl transition shadow-[0_0_15px_rgba(16,185,129,0.3)] text-center";
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) renderQuestion(currentIndex - 1);
        }

        function handleNextOrSubmit() {
            if (currentIndex < quizData.length - 1) {
                renderQuestion(currentIndex + 1);
            } else {
                if (confirm("Yakin ingin mengakhiri dan menyelesaikan ujian ini?")) {
                    document.getElementById("form-submit-exam").submit();
                }
            }
        }

        // Render Grid Modal Navigasi
        function renderGrid() {
            const grid = document.getElementById("nav-grid");
            grid.innerHTML = "";

            quizData.forEach((_, idx) => {
                const btn = document.createElement("button");
                const isAnswered = answers[idx] !== undefined;
                const isRagu = raguState[idx] === true;
                const isCurrent = idx === currentIndex;

                let colorClasses = "bg-slate-950 border-slate-800 text-slate-400";
                if (isRagu) {
                    colorClasses = "bg-amber-500/20 border-amber-500/60 text-amber-300 font-bold";
                } else if (isAnswered) {
                    colorClasses = "bg-emerald-500/20 border-emerald-500/60 text-emerald-300 font-bold";
                }

                btn.className = `h-10 text-xs rounded-xl border transition ${colorClasses} ${
                    isCurrent ? 'ring-2 ring-emerald-400 border-emerald-400' : ''
                }`;
                btn.textContent = idx + 1;
                btn.onclick = () => {
                    renderQuestion(idx);
                    toggleNavModal(false);
                };
                grid.appendChild(btn);
            });
        }

        // Timer Presisi
        const endTime = new Date().getTime() + (durationMinutes * 60 * 1000);
        setInterval(() => {
            const now = new Date().getTime();
            const diff = endTime - now;

            if (diff <= 0) {
                alert("Waktu Ujian telah Habis!");
                document.getElementById('form-submit-exam').submit();
                return;
            }

            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById("timer-display").textContent = 
                `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        }, 1000);

        document.addEventListener("DOMContentLoaded", function() {
            renderQuestion(0);
        });
    </script>
</body>
</html>
