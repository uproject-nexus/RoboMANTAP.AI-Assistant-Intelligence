<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#7b5cff">
<title>Masuk Kuis - RoboMANTAP</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:'Nunito',system-ui,sans-serif;color:#1f2a52;
background:radial-gradient(circle at 0 0,#fff3c4,transparent 35%),radial-gradient(circle at 100% 0,#e3d9ff,transparent 38%),#f6fbff}
.card{width:100%;max-width:440px;background:#fff;border:2px solid #e6ebff;border-radius:30px;padding:26px 22px;box-shadow:0 18px 40px rgba(123,92,255,.16)}
.badge{display:inline-block;background:linear-gradient(135deg,#ffd23f,#ff9f6b);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:900}
h1{margin:12px 0 4px;font-size:28px;line-height:1.1}
p.sub{margin:0 0 18px;color:#5d6b8a;font-size:14px;font-weight:700}
.err{background:#ffe9e9;border:2px solid #ff6b6b;color:#b42323;border-radius:16px;padding:12px;margin-bottom:14px;font-weight:800;font-size:14px;text-align:center}
label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;color:#5d6b8a}
input{width:100%;font:inherit;font-size:16px;font-weight:700;color:#1f2a52;background:#f8faff;border:2px solid #e6ebff;border-radius:16px;padding:14px}
input:focus{outline:none;border-color:#7b5cff;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input.token{text-transform:uppercase;letter-spacing:.08em;border-color:#06d6a0}
button{width:100%;margin-top:20px;font:inherit;font-weight:900;font-size:17px;color:#fff;border:0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#7b5cff,#4cc9f0);box-shadow:0 5px 0 #5a43c9;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}
.note{margin-top:16px;text-align:center;font-size:13px;font-weight:700;color:#5d6b8a}
</style>
</head>
<body>
<main class="card">
  <span class="badge">🌈 Portal Kuis Santriwati</span>
  <h1>Siap mengerjakan kuis?</h1>
  <p class="sub">Isi data dirimu dan Kode Kuis dari guru. Kamu pasti bisa! 💪</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form action="/verify-token" method="POST">
    <label for="nama">Nama Lengkap</label>
    <input id="nama" type="text" name="nama" required autocomplete="name" placeholder="Nama lengkapmu">
    <div class="row">
      <div><label for="kelas">Kelas</label><input id="kelas" type="text" name="kelas" required placeholder="12"></div>
      <div><label for="absen">No. Absen</label><input id="absen" type="text" name="absen" required inputmode="numeric" placeholder="05"></div>
    </div>
    <label for="token">Kode Kuis</label>
    <input id="token" class="token" type="text" name="token" required autocapitalize="characters" placeholder="CONTOH: MTK-12A">
    <button type="submit">Mulai sekarang ✨</button>
  </form>
  <div class="note">Bismillah, kerjakan dengan jujur dan tenang 🤍</div>
</main>
</body>
</html>
