<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#f45f88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/robomantap-icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/static/robomantap-icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login Quiz - RoboMANTAP CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
<style id="robomantap-mobile-bright-theme">
:root{color-scheme:light;--rm-ink:#29354e;--rm-muted:#68758d;--rm-pink:#f45f88;--rm-orange:#ffad5a;--rm-mint:#45c6b1}
html,body{min-height:100%;background:radial-gradient(ellipse at 8% 0%,rgba(255,193,210,.28),transparent 30%),radial-gradient(ellipse at 100% 5%,rgba(255,218,165,.3),transparent 28%),linear-gradient(180deg,#fffaf4,#fffdf9 55%,#f3fffb)!important;color:var(--rm-ink)!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
.bg-slate-950{background-color:#fff8f3!important}.bg-slate-900{background-color:#fff!important}.bg-slate-800{background-color:#f5f0f6!important}.bg-slate-700{background-color:#f0ebf4!important}
.text-white,.text-slate-100,.text-slate-200{color:var(--rm-ink)!important}.text-slate-300,.text-slate-400,.text-slate-500{color:var(--rm-muted)!important}
.text-emerald-400,.text-emerald-300{color:#168977!important}.text-rose-400,.text-rose-300{color:#d94f75!important}.text-amber-400{color:#b8791c!important}
.border-slate-800,.border-slate-700,.border-slate-600{border-color:#eee3e5!important}[class*="border-emerald-500"]{border-color:#f0cbd7!important}[class*="border-rose-500"]{border-color:#f2c8d1!important}
[class*="bg-emerald-500/10"]{background:#e4f8f0!important}[class*="bg-rose-500/10"]{background:#fff0f3!important}
[class*="shadow-"]{box-shadow:0 8px 24px rgba(70,65,88,.07)!important}
input,select,textarea{width:100%;min-height:48px;background:#fff!important;color:var(--rm-ink)!important;border:1px solid #e8dfe5!important;border-radius:14px!important;font-size:16px!important;outline-color:#f58baa!important}input::placeholder{color:#9aa3b4!important}
button,.btn,.btn2{min-height:48px!important;border-radius:15px!important;font-weight:850!important;box-shadow:0 7px 16px rgba(244,95,136,.14);transition:transform .15s ease,filter .15s ease}
button,.btn{color:#fff!important;background:linear-gradient(115deg,#f45f88,#ff9569)!important;border:0!important}
.btn2{display:flex;align-items:center;justify-content:center;color:#46516a!important;background:#fff!important;border:1px solid #eadfe5!important;box-shadow:0 5px 14px rgba(70,65,88,.06)}
a{color:#c34b76}
.mode-card{background:linear-gradient(135deg,#ffe6ef,#fff4dc 58%,#e2faf1)!important;border:1px solid #f1dfe5!important;border-radius:23px!important;padding:clamp(16px,4vw,24px)!important;box-shadow:0 9px 23px rgba(70,65,88,.06)!important}
#question-box{min-height:0!important;background:#fff!important;border-color:#f0e3e6!important;border-radius:20px!important;box-shadow:0 7px 20px rgba(70,65,88,.04)}
#question-text{color:#29354e!important;line-height:1.6!important}#options-container label{background:#fff!important;border:1px solid #eee3e5!important;border-radius:14px!important;padding:12px!important;color:#29354e!important}
@media(max-width:640px){body{padding:.7rem!important;align-items:flex-start!important}.max-w-md,.max-w-lg,.max-w-xl,.max-w-3xl{max-width:100%!important}.p-8,.p-6{padding:1.15rem!important}.rounded-2xl{border-radius:21px!important}.text-4xl{font-size:2.25rem!important}.grid{gap:.65rem!important}input,select,textarea{font-size:16px!important}#question-box{padding:14px!important}button,.btn,.btn2{width:100%;font-size:14px!important}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 sm:p-8 shadow-[0_0_30px_rgba(16,185,129,0.15)]">
        <div class="text-center mb-6">
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-bold text-[10px] px-3 py-1 rounded-full uppercase tracking-widest">
                Portal Kuis Santriwati
            </span>
            <h1 class="text-xl sm:text-2xl font-black text-white mt-3 tracking-tight">RoboMANTAP CBT</h1>
            <p class="text-xs text-slate-400 mt-1">Masukkan data diri dan Kode Kuis dari GuruMANTAP</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/40 text-rose-400 text-xs p-3 rounded-xl mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/verify-token" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Nama Lengkap</label>
                <input type="text" name="nama" required placeholder="Masukkan Nama Lengkap Santriwati" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Kelas</label>
                    <input type="text" name="kelas" required placeholder="12" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">No. Absen</label>
                    <input type="text" name="absen" required placeholder="05" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-">Kode Kuis</label>
                <input type="text" name="token" required placeholder="CONTOH: MTK-12A" class="w-full bg-slate-950 border border-emerald-500/50 rounded-xl px-4 py-3 text-base font-mono font-bold text-emerald-300 uppercase focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-500 active:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-[0_0_15px_rgba(16,185,129,0.4)] mt-2">
                Masuk →
            </button>
        </form>
    </div>
</body>
</html>
